name: Next.js CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'feature/*'
      - 'fix/*'
      - 'IGG_*'

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Ideal for Next.js 15
          cache: 'npm'
          
