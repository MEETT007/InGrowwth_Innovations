services:
  web:
    image: node:22-alpine
    working_dir: /app
    tty: true
    stdin_open: true
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      # Keep node_modules inside the container (isolated from Windows host)
      - ingrowwth_node_modules:/app/node_modules
      - ingrowwth_next_cache:/app/.next
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      # Enable polling for hot-reload on Windows/WSL/Hyper-V setups
      - WATCHPACK_POLLING=true
    # Install deps and start dev server
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0"

volumes:
  ingrowwth_node_modules:
  ingrowwth_next_cache:
